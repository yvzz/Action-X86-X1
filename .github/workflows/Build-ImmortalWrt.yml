name: Build ImmortalWrt for X1Pro

permissions:
  contents: write

on:
  # push:
  #   branches: [ main, master ]
  workflow_dispatch:
    inputs:
      source_repo:
        description: '源码仓库地址'
        required: false
        type: string
        default: 'https://github.com/padavanonly/immortalwrt-mt798x-6.6'
      verbose:
        description: '启用详细编译日志 V=s（出错调试用）'
        required: false
        type: boolean
        default: false
      publish:
        description: '发布编译产物到 Release'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: 0 20 * * 6
  repository_dispatch:
    types: [ "X1Pro Update" ]

env:
  TZ: Asia/Shanghai
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_CONFIGPATH: ${{ github.workspace }}/.ccache.conf
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    name: Build X1Pro Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check Server Performance
        run: |
          echo "警告!!!"
          echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo -e "已知CPU型号(降序): 9V74、7763、6973P-C、8370C、8272CL、8171M、E5-2673\n"
          echo "--------------------------CPU信息--------------------------"
          echo "CPU物理数量: $(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
          echo "CPU核心数量: $(nproc)"
          echo -e "CPU型号信息:$(cat /proc/cpuinfo | grep -m1 name | awk -F: '{print $2}')\n"
          echo "--------------------------内存信息--------------------------"
          echo "已安装内存详细信息:"
          echo -e "$(sudo lshw -short -C memory | grep GiB)\n"
          echo "--------------------------硬盘信息--------------------------"
          echo "硬盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

      - name: Checkout
        uses: actions/checkout@v7

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential gawk unzip file wget python3 \
            python3-pip python3-setuptools python3-yaml \
            rsync curl git \
            libncurses-dev libssl-dev libelf-dev \
            zlib1g-dev time subversion gettext patch perl \
            squashfs-tools \
            python3-ply python3-docutils python3-pyelftools \
            ccache jq
          pip3 install pyelftools --break-system-packages 2>/dev/null || true
          sudo timedatectl set-timezone "$TZ"

      - name: Prepare feeds cache key
        id: feeds
        run: |
          FEEDS_PACKAGES=$(git ls-remote https://github.com/immortalwrt/packages.git openwrt-24.10 | cut -f1)
          FEEDS_LUCI=$(git ls-remote https://github.com/immortalwrt/luci.git openwrt-24.10 | cut -f1)
          FEEDS_ROUTING=$(git ls-remote https://github.com/openwrt/routing.git openwrt-24.10 | cut -f1)
          FEEDS_HASH=$(echo "$FEEDS_PACKAGES $FEEDS_LUCI $FEEDS_ROUTING" | sha256sum | cut -d' ' -f1)
          echo "feeds_hash=$FEEDS_HASH" >> $GITHUB_OUTPUT

      - name: Clone source
        run: |
          SOURCE_REPO="${{ inputs.source_repo || 'https://github.com/padavanonly/immortalwrt-mt798x-6.6' }}"
          echo "Cloning source from: $SOURCE_REPO"
          git clone --depth=1 "$SOURCE_REPO" source

      - name: Setup ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          echo "cache_dir = $CCACHE_DIR" | sudo tee /etc/ccache.conf >/dev/null
          sudo chmod 644 /etc/ccache.conf
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size=$CCACHE_MAXSIZE
          ccache --set-config=compression=true
          ccache -z
          echo "--- effective cache_dir ---"
          ccache -p 2>/dev/null | grep -i cache_dir || true
          sudo mkdir -p /workdir/.ccache
          sudo chmod -R 777 /workdir/.ccache

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            source/dl
            source/staging_dir
            ${{ github.workspace }}/.ccache
          key: build-cache-${{ hashFiles('feeds.conf.default', '.github/workflows/Build-ImmortalWrt.yml') }}-${{ steps.feeds.outputs.feeds_hash }}-${{ runner.os }}
          restore-keys: build-cache-${{ runner.os }}-

      - name: Update & Install feeds
        working-directory: source
        run: |
          cp $GITHUB_WORKSPACE/feeds.conf.default .
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        working-directory: source
        run: |
          cp $GITHUB_WORKSPACE/config/X1Pro.config .config
          sed -i "/CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_/d" .config
          sed -i "/CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_/d" .config
          echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_oray_x1_pro=y" >> .config
          echo "CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_oray_x1_pro=\"kmod-usb3 kmod-mt7915e kmod-mt7981-firmware mt7981-wo-firmware automount\"" >> .config
          chmod +x $GITHUB_WORKSPACE/diy-part1.sh
          $GITHUB_WORKSPACE/diy-part1.sh
          make defconfig
          # defconfig 会自动启用 filogic 下所有注册设备，强制关闭非 X1 Pro 的
          sed -i '/CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_oray_x1_pro/!{/CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_/s/=y/=n/}' .config
          make defconfig
          echo "=== Target devices after defconfig ==="
          grep "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y" .config || echo "(none)"
          echo "=== Ruby/Perl check ==="
          grep -iE "CONFIG_PACKAGE_(ruby|perl)" .config || echo "(no ruby/perl packages)"

      - name: Build
        id: compile
        working-directory: source
        env:
          CCACHE_MAXSIZE: 2G
        run: |
          sudo fallocate -l 4G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          NPROC=$(($(/usr/bin/nproc) > 4 ? 4 : $(/usr/bin/nproc)))
          echo "CPU: $(/usr/bin/nproc) cores, using -j${NPROC}"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CCACHE_CONFIGPATH="$GITHUB_WORKSPACE/.ccache.conf"
          export CCACHE_MAXSIZE=2G
          ccache -z 2>/dev/null || true
          /usr/bin/make download -j${NPROC}
          /usr/bin/make toolchain/binutils/prepare V=s 2>/dev/null || true
          for rf in build_dir/toolchain-*/binutils-*/binutils/readelf.c; do
            if [ -f "$rf" ]; then
              sed -i 's/off64_t/off_t/g; s/fseeko64/fseeko/g' "$rf"
              echo "Patched $rf"
            fi
          done
          # 增量展开 GCC 源码（不完整编译），patch 其残留的 off64_t
          /usr/bin/make toolchain/gcc/initial/prepare V=s 2>/dev/null || true
          for f in build_dir/toolchain-*/gcc-*/libcpp/files.c \
                   build_dir/toolchain-*/gcc-*/gcc/genhooks.c \
                   build_dir/toolchain-*/gcc-*/gcc/system.h; do
            [ -f "$f" ] || continue
            sed -i 's/off64_t/off_t/g; s/fseeko64/fseeko/g' "$f"
            echo "Patched $f"
          done

          if [ "${{ inputs.verbose }}" = "true" ]; then
            /usr/bin/make -j${NPROC} V=s 2>&1 | tee build.log
          else
            /usr/bin/make -j${NPROC} 2>&1 | tee build.log
          fi

          SYSUPGRADE=$(find bin/targets -name "*oray_x1-pro*sysupgrade.bin" 2>/dev/null | head -1)
          if [ -n "$SYSUPGRADE" ]; then
            echo "Firmware built: $SYSUPGRADE ($(du -h "$SYSUPGRADE" | cut -f1))"
            echo "name=$(basename "$SYSUPGRADE")" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "=== BUILD FAILED — extracting errors from build.log ==="
            grep -iE "error[: ]|Error 1|Error 2|failed to|cannot find|No such file|undefined reference|No rule to make" build.log | tail -100 || echo "(no error patterns found)"
            echo ""
            echo "=== Last 200 lines of build.log ==="
            tail -200 build.log || true
            echo "ERROR: No firmware found!"
            find bin/targets -name "*.bin" 2>/dev/null | head -10
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi
          df -hT /home/runner/work

      - name: List build artifacts
        run: |
          echo "=== Firmware artifacts ==="
          find source/bin/targets -name "*oray_x1-pro*" 2>/dev/null | while read f; do
            echo "  $(basename $f) ($(du -h "$f" | cut -f1))"
          done

      - name: Set build info
        id: info
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          BUILD_TIME=$(date +%H%M)
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT

      - name: Upload build.log (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: source/build.log
          retention-days: 7

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: ImmortalWrt_X1Pro-${{ steps.info.outputs.build_date }}-${{ steps.info.outputs.build_time }}-oray_x1-pro
          path: source/bin/targets/mediatek/filogic/*oray_x1-pro*squashfs-sysupgrade.bin
          retention-days: 30

      - name: Create Release
        if: inputs.publish == true || github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          tag_name: v${{ steps.info.outputs.build_date }}-${{ steps.info.outputs.build_time }}
          name: ImmortalWrt X1Pro ${{ steps.info.outputs.build_date }}-${{ steps.info.outputs.build_time }}
          generate_release_notes: true
          files: |
            source/bin/targets/mediatek/filogic/*oray_x1-pro*squashfs-sysupgrade.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Old Releases
        if: steps.compile.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RETENTION=7
          CUTOFF=$(date -d "$RETENTION days ago" +%s)
          echo "保留最近 ${RETENTION} 天的 Release"

          releases=$(gh release list \
            --exclude-drafts \
            --json tagName,publishedAt \
            --jq '.[] | "\(.publishedAt)|\(.tagName)"')

          if [ -z "$releases" ]; then
            echo "没有可删除的 Release"
            exit 0
          fi

          deleted=0
          kept=0

          while IFS='|' read -r published tag; do
            [ -z "$tag" ] && continue
            published_ts=$(date -d "$published" +%s 2>/dev/null)
            if [ -z "$published_ts" ]; then
              echo "  跳过: $tag (无法解析日期)"
              continue
            fi
            if [ "$published_ts" -lt "$CUTOFF" ]; then
              echo "  删除: $tag (发布于 $published)"
              gh release delete "$tag" --yes --repo ${{ github.repository }}
              deleted=$((deleted + 1))
            else
              echo "  保留: $tag (发布于 $published)"
              kept=$((kept + 1))
            fi
          done <<< "$releases"

          echo ""
          echo "完成: 删除 ${deleted} 个, 保留 ${kept} 个"

      - name: Delete Orphan Tags
        if: steps.compile.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO=${{ github.repository }}
          echo "获取所有 Remote Tag..."
          remote_tags=$(gh api "repos/$REPO/git/matching-refs/tags" --paginate --jq '.[].ref' 2>/dev/null)

          if [ -z "$remote_tags" ]; then
            echo "没有 Tag"
            exit 0
          fi

          deleted=0
          for ref in $remote_tags; do
            tag=$(echo "$ref" | sed 's|^refs/tags/||')
            release=$(gh release view "$tag" --json tagName --jq '.tagName' 2>/dev/null || true)
            if [ -z "$release" ]; then
              echo "  删除孤立 Tag: $tag"
              if gh api --method DELETE "repos/$REPO/git/refs/tags/$tag" \
                   --silent 2>/tmp/delete_err.log; then
                deleted=$((deleted + 1))
                echo "    ✓ 已删除"
              else
                echo "    ⚠ 删除失败: $(cat /tmp/delete_err.log)"
              fi
            else
              echo "  保留 (有 Release): $tag"
            fi
          done

          echo ""
          echo "完成: 删除 ${deleted} 个孤立 Tag"

      - name: Delete Old Workflow Runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RETAIN_DAYS=3
          CURRENT_RUN_ID="${{ github.run_id }}"
          echo "清理超过 ${RETAIN_DAYS} 天的 Workflow Runs (当前 run: $CURRENT_RUN_ID)"

          gh run list -R ${{ github.repository }} --limit 200 \
            --json databaseId,status,conclusion,createdAt,updatedAt \
            > /tmp/runs.json

          > /tmp/ids-to-delete.txt

          CUTOFF=$(date -u -d "$RETAIN_DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)

          # failed/cancelled/skipped: 不受时间限制，全删
          jq -r --arg CURRENT "$CURRENT_RUN_ID" \
            '.[] | select(.status == "completed") | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "skipped") | select((.databaseId | tostring) != $CURRENT) | .databaseId | tostring' \
            /tmp/runs.json >> /tmp/ids-to-delete.txt

          # success runs: 删超过保留期的
          jq -r --arg CURRENT "$CURRENT_RUN_ID" --arg CUTOFF "$CUTOFF" \
            '.[] | select(.status == "completed") | select(.conclusion == "success") | select((.databaseId | tostring) != $CURRENT) | select(.createdAt < $CUTOFF) | .databaseId | tostring' \
            /tmp/runs.json >> /tmp/ids-to-delete.txt

          COUNT=$(wc -l < /tmp/ids-to-delete.txt)
          echo "Found $COUNT runs to delete"

          if [ "$COUNT" -eq 0 ]; then
            exit 0
          fi

          while read -r id; do
            echo "Deleting run: $id"
            gh run delete "$id" -R ${{ github.repository }} 2>&1 | sed 's/^/  /' || echo "  Failed: $id"
          done < /tmp/ids-to-delete.txt

          echo "Done"
